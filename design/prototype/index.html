/* Layout: mobile-first app shell — sticky header, single reading column (max 720px), bottom tab bar on phones, wide 2-pane workspace for officers.

:root {
  --bg: #F6F7F8; --surface: #FFFFFF; --sunken: #EDEFF1;
  --brand: #0F5551; --brand-hover: #0B4341; --brand-subtle: #E8F4F3; --accent-subtle: #FFF6E5; --gold: #F2C25C;
  --text: #1A1F25; --text-2: #545E69; --on-brand: #FFFFFF; --text-brand: #0F5551; --link: #0F5551;
  --border: #DCE0E4; --control: #6B7580; --focus: #1D5A9E;
  --ok: #1C6B3A; --ok-bg: #E8F5EC; --warn: #8A5A00; --warn-bg: #FFF6E5;
  --danger: #A4211B; --danger-bg: #FDECEA; --info: #1D5A9E; --info-bg: #E8F0FA;
  --banner-bg: #FCE7B8; --banner-fg: #5A3B00; --mark-tile: #0F5551;

  --font-lat: "IBM Plex Sans", "Noto Sans", "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px;
}
@media (prefers-color-scheme: dark) {

    --brand: #67B5AE; --brand-hover: #9CD0CB; --brand-subtle: #073230; --accent-subtle: #5A3B00; --gold: #F2C25C;
    --text: #F6F7F8; --text-2: #C2C8CF; --on-brand: #073230; --text-brand: #67B5AE; --link: #9CD0CB;
    --border: #3E4751; --control: #9AA3AD; --focus: #8DB6E8;
    --ok: #7FCB98; --ok-bg: #1A1F25; --warn: #F2C25C; --warn-bg: #1A1F25;
    --danger: #F19A93; --danger-bg: #1A1F25; --info: #8DB6E8; --info-bg: #1A1F25;
    --banner-bg: #5A3B00; --banner-fg: #FCE7B8; --mark-tile: #0F5551;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.45);

  }
}
:root[data-theme="dark"] {
  --bg: #0F1317; --surface: #1A1F25; --sunken: #2A3139;
  --brand: #67B5AE; --brand-hover: #9CD0CB; --brand-subtle: #073230; --accent-subtle: #5A3B00; --gold: #F2C25C;
  --text: #F6F7F8; --text-2: #C2C8CF; --on-brand: #073230; --text-brand: #67B5AE; --link: #9CD0CB;
  --border: #3E4751; --control: #9AA3AD; --focus: #8DB6E8;
  --ok: #7FCB98; --ok-bg: #1A1F25; --warn: #F2C25C; --warn-bg: #1A1F25;
  --danger: #F19A93; --danger-bg: #1A1F25; --info: #8DB6E8; --info-bg: #1A1F25;
  --banner-bg: #5A3B00; --banner-fg: #FCE7B8; --mark-tile: #0F5551;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-lat); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
html[lang="ar"] body { font-family: var(--font-ar); line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--link); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
h1[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mono, .ref { font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--text-2); }
.small { font-size: 14px; }
.skip { position: absolute; inset-inline-start: 16px; top: -100px; background: var(--surface); padding: 8px 12px; border-radius: var(--r-md); z-index: 50; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }

/* Environment banner (non-dismissable) */
.env-banner {
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--banner-bg); color: var(--banner-fg); font-size: 14px; font-weight: 600; text-align: center;
}

/* Header */
.header {
  position: relative; z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.header-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 1200px; margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-brand); text-decoration: none; font-family: var(--font-lat); }
.brand svg { width: 32px; height: 32px; flex: none; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--r-md); overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 8px 12px; min-height: 40px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.lang button { font-size: 14px; }
.lang button[lang="ar"] { font-family: var(--font-ar); }
.topnav { display: none; gap: 4px; max-width: 1200px; margin: 8px auto 0; }
.topnav a { padding: 8px 12px; border-radius: var(--r-md); text-decoration: none; color: var(--text); font-weight: 500; }
.topnav a[aria-current="page"] { background: var(--brand-subtle); color: var(--text-brand); font-weight: 600; }

/* Mandate banner */
.mandate { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 10px 14px; border-radius: var(--r-md); background: var(--info-bg); color: var(--info); border: 2px solid var(--info); font-weight: 600; }
.mandate .btn { margin-inline-start: auto; }

/* Layout */
main { max-width: 720px; margin: 20px auto 0; display: grid; gap: 20px; }
main > *, .stack > * { min-width: 0; }
main.wide { max-width: 1200px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card.hl { border: 2px solid var(--warn); background: var(--warn-bg); }
.hero { background: var(--brand); color: var(--on-brand); border: 0; }
.hero p { color: var(--on-brand); opacity: 0.92; }
.hero .btn-light { background: var(--surface); color: var(--text-brand); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: var(--r-md); border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); color: var(--text-brand); border-color: var(--control); }
.btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.btn-sm { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--link); text-decoration: underline; text-underline-offset: 3px; font: inherit; font-weight: 600; cursor: pointer; }

/* Badges & chips */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.b-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
.b-info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info); }
.b-neutral { background: var(--sunken); color: var(--text); border: 1px solid var(--border); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--control); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; min-height: 44px; font: inherit; font-size: 14px; cursor: pointer; text-align: start; }
.chip:hover { border-color: var(--brand); color: var(--text-brand); }

/* Lists */
ol.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 6px 16px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding-bottom: 16px; position: relative; }
.timeline li::before { content: ""; position: absolute; inset-inline-start: 13px; top: 28px; bottom: 0; width: 2px; background: var(--border); }
.timeline li:last-child::before { display: none; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--sunken); color: var(--text-2); border: 2px solid var(--border); }
.dot.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.dot.now { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }

/* Guide */
.chat { display: grid; gap: 12px; }
.msg { padding: 12px 14px; border-radius: var(--r-lg); max-width: 92%; white-space: pre-line; min-width: 0; overflow-wrap: anywhere; }
.msg.user { background: var(--brand-subtle); color: var(--text); justify-self: end; border-end-end-radius: var(--r-sm); }
.msg.bot { background: var(--surface); border: 1px solid var(--border); justify-self: start; border-end-start-radius: var(--r-sm); display: grid; gap: 10px; white-space: normal; }
.msg.bot .body { white-space: pre-line; }
.msg.bot.refusal { border-color: var(--warn); }
.ai-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-brand); }
.cites { display: grid; gap: 6px; border-top: 1px solid var(--border); padding-top: 8px; font-size: 14px; }
.cite { display: flex; gap: 8px; align-items: baseline; }
.cite .n { font-family: var(--font-mono); font-weight: 600; color: var(--text-brand); }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1 1 0; width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px; border: 1px solid var(--control); border-radius: var(--r-md); font: inherit; background: var(--surface); color: var(--text); }
.notice { padding: 10px 14px; border-radius: var(--r-md); background: var(--accent-subtle); color: var(--text); border: 1px solid var(--border); font-size: 14px; }

/* Wallet */
.cred { border-radius: var(--r-xl); padding: 18px; display: grid; gap: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); position: relative; overflow: hidden; }
.cred::after { content: attr(data-wm); position: absolute; inset-inline-end: -40px; top: 18px; transform: rotate(35deg); background: var(--banner-bg); color: var(--banner-fg); font-size: 11px; font-weight: 700; padding: 4px 48px; letter-spacing: 0.06em; }
html[dir="rtl"] .cred::after { transform: rotate(-35deg); }
.cred .issuer { display: flex; align-items: center; gap: 10px; }
.cred .seal { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-subtle); color: var(--text-brand); display: grid; place-items: center; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }
canvas#qr { width: 200px; height: 200px; max-width: 100%; image-rendering: pixelated; border-radius: var(--r-md); }

/* Tables (workspace) */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-2); font-weight: 600; background: var(--sunken); }
tr.sel td { background: var(--brand-subtle); }
tr[data-case] { cursor: pointer; }
.ws-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; }
.kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
select, textarea { font: inherit; min-height: 44px; padding: 8px 12px; border: 1px solid var(--control); border-radius: var(--r-md); background: var(--surface); color: var(--text); width: 100%; }

/* Tab bar (phones) */
.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; min-height: 52px; text-decoration: none; color: var(--text-2); font-size: 12px; font-weight: 600; border-radius: var(--r-md); }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--text-brand); background: var(--brand-subtle); }
@media (min-width: 760px) { .tabbar { display: none; } .topnav { display: flex; } body { padding-block: 0 48px; } .header { position: sticky; top: env(safe-area-inset-top, 0px); } }

/* Toast */
.toast { position: fixed; z-index: 40; inset-inline: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 560px; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--r-md); box-shadow: var(--shadow); font-weight: 500; }
@media (min-width: 760px) { .toast { bottom: 24px; } }
footer { max-width: 1200px; margin: 32px auto 0; color: var(--text-2); font-size: 14px; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .seg button { transition: background-color 120ms cubic-bezier(0.2, 0, 0, 1); } }
</style>

    return '<h1 tabindex="-1">' + esc(t("req_title")) + '</h1><div class="row"><span class="muted">' + esc(t("ref")) + '</span><span class="ref">REQ-2026-00412</span>' + statusBadge(r.status) + "</div>" +
      '<section class="card" aria-labelledby="hist"><h2 id="hist">' + esc(t("history")) + '</h2><ol class="timeline">' + tl + "</ol>" + (actions ? "<div>" + actions + "</div>" : "") + "</section>" +
      '<section class="card" aria-labelledby="chk"><h2 id="chk">' + esc(t("checklist")) + '</h2><ul class="plain"><li class="row"><span>' + esc(t("doc_id")) + '</span><span class="badge b-ok">✓ ' + esc(t("present")) + '</span></li><li class="row"><span>' + esc(t("doc_addr")) + "</span>" + (r.addr ? '<span class="badge b-ok">✓ ' + esc(t("present")) + "</span>" : '<span class="badge b-warn">! ' + esc(t("missing")) + "</span>") + "</li></ul></section>" +
      '<section class="card" aria-labelledby="ap"><h2 id="ap">' + esc(t("appt")) + "</h2>" + appt + "</section>";
  }
  function vWallet() {
    var attrs = [["name", "attr_name", "v_name"], ["degree", "attr_degree", "v_degree"], ["year", "attr_year", "v_year"], ["birth", "attr_birth", "v_birth"], ["grade", "attr_grade", "v_grade"]];
    var present = "";
    if (state.presenting) {
      present = '<section class="card" aria-labelledby="pr"><h2 id="pr">' + esc(t("choose_share")) + "</h2>" +
        attrs.map(function (a) { return '<label class="check" for="sh-' + a[0] + '"><input type="checkbox" id="sh-' + a[0] + '" data-share="' + a[0] + '"' + (state.share[a[0]] ? " checked" : "") + "> " + esc(t(a[1])) + "</label>"; }).join("") +
        '<p class="muted small">' + esc(t("share_note")) + '</p><div class="row" style="align-items:flex-start"><canvas id="qr" width="232" height="232" role="img" aria-label="' + esc(t("qr_note")) + '"></canvas><div class="stack small" style="min-width:0"><strong>' + esc(t("shared")) + '</strong><ul class="plain" id="shared-list">' +
        attrs.filter(function (a) { return state.share[a[0]]; }).map(function (a) { return "<li>" + esc(t(a[1])) + ": " + esc(t(a[2])) + "</li>"; }).join("") + '</ul><p class="muted">' + esc(t("qr_note")) + '</p></div></div><div><button class="btn btn-secondary btn-sm" data-act="hideqr">' + esc(t("hide")) + "</button></div></section>";
    }
    return '<h1 tabindex="-1">' + esc(t("wallet_title")) + "</h1>" +
      '<article class="cred" data-wm="' + esc(t("wm")) + '"><div class="issuer"><span class="seal" aria-hidden="true">DU</span><div><strong>' + esc(t("cred_title")) + '</strong><p class="muted small">' + esc(t("cred_issuer")) + '</p></div></div><dl class="kv">' +
      attrs.map(function (a) { return "<dt>" + esc(t(a[1])) + "</dt><dd>" + esc(t(a[2])) + "</dd>"; }).join("") + '</dl><div class="row"><span class="badge b-ok">✓ ' + esc(t("valid")) + "</span>" + (state.presenting ? "" : '<button class="btn btn-primary btn-sm" data-act="present">' + esc(t("present_btn")) + "</button>") + "</div></article>" + present +
      '<section class="card" aria-labelledby="rem"><h2 id="rem">' + esc(t("reminders")) + "</h2><p>" + esc(t("rem_passport")) + "</p></section>";
  }
  function vPrivacy() {
    var cons = ["c1", "c2"].map(function (c) {
      var on = state.consents[c];
      return '<article class="card"><div class="row"><h3>' + esc(t(c + "_title")) + "</h3>" + (on ? "" : '<span class="badge b-neutral">' + esc(t("revoked")) + "</span>") + '</div><p class="small">' + esc(t(c + "_body")) + "</p>" + (on ? '<div><button class="btn btn-danger btn-sm" data-revoke="' + c + '">' + esc(t("revoke")) + "</button></div>" : "") + "</article>";
    }).join("");
    var log = state.log.map(function (l) { return '<li class="card"><span class="muted small mono">' + l[1] + "</span><span>" + esc(t(l[0])) + "</span></li>"; }).join("");
    return '<h1 tabindex="-1">' + esc(t("privacy_title")) + "</h1>" +
      '<section class="stack" aria-labelledby="lg"><h2 id="lg">' + esc(t("log")) + '</h2><p class="muted small">' + esc(t("log_hint")) + '</p><ul class="plain">' + log + "</ul></section>" +
      '<section class="stack" aria-labelledby="cs"><h2 id="cs">' + esc(t("consents")) + "</h2>" + cons + "</section>" +
      '<section class="card" aria-labelledby="md"><h2 id="md">' + esc(t("mandates")) + "</h2><p>" + esc(t("m1")) + '</p><p class="muted small">' + esc(t("m_revoke_note")) + "</p></section>";
  }
  function vWorkspace() {
    var rows = queue.map(function (q) {
      var st = q.own ? state.req.status : q.st;
      return '<tr data-case="' + q.ref + '"' + (state.selected === q.ref ? ' class="sel"' : "") + '><td><button class="linkbtn ref" data-case="' + q.ref + '"' + (state.selected === q.ref ? ' aria-current="true"' : "") + '>' + q.ref + "</button></td><td>" + esc(t(q.svc)) + "</td><td>" + esc(who(q.who)) + "</td><td>" + statusBadge(st) + "</td><td>" + slaBadge(q.sla) + ' <span class="mono small">' + q.due + "</span></td></tr>";
    }).join("");
    var open = queue.filter(function (q) { var s = q.own ? state.req.status : q.st; return s !== "ready" && s !== "rejected"; }).length;
    var risk = queue.filter(function (q) { return q.sla !== "ok" && !(q.own && (state.req.status === "ready" || state.req.status === "rejected")); }).length;
    var detail;
    var sel = queue.filter(function (q) { return q.ref === state.selected; })[0];
    if (!sel) detail = '<section class="card"><p class="muted">' + esc(t("select_case")) + "</p></section>";
    else if (!sel.own) detail = '<section class="card"><h2>' + esc(t("case_detail")) + '</h2><p class="ref">' + sel.ref + "</p><p>" + esc(t(sel.svc)) + " · " + esc(who(sel.who)) + '</p><p class="muted small">' + esc(t("demo_case")) + "</p></section>";
    else {
      var r = state.req, closed = r.status === "ready" || r.status === "rejected";
      var hist = r.history.map(function (h) { return '<li class="row small"><span class="mono muted">' + h[1] + "</span>" + statusBadge(h[0]) + "</li>"; }).join("");
      var rej = state.rejecting ? '<div class="stack"><label for="rr" class="small"><strong>' + esc(t("reason")) + '</strong></label><select id="rr"><option value="r1">' + esc(t("r1")) + '</option><option value="r2">' + esc(t("r2")) + '</option><option value="r3">' + esc(t("r3")) + '</option></select><div><button class="btn btn-danger btn-sm" data-act="confirmreject">' + esc(t("confirm_reject")) + "</button></div></div>" : "";
      detail = '<section class="card" aria-labelledby="cd"><h2 id="cd">' + esc(t("case_detail")) + '</h2><div class="row"><span class="ref">' + sel.ref + "</span>" + statusBadge(r.status) + "</div><p>" + esc(t("svc_res")) + " · " + esc(who(sel.who)) + '</p><p class="muted small">' + esc(t("applicant_min")) + "</p>" +
        "<h3>" + esc(t("checklist")) + '</h3><ul class="plain"><li class="row"><span>' + esc(t("doc_id")) + '</span><span class="badge b-ok">✓ ' + esc(t("verified")) + '</span></li><li class="row"><span>' + esc(t("doc_addr")) + "</span>" + (r.addr ? '<span class="badge b-ok">✓ ' + esc(t("present")) + "</span>" : '<span class="badge b-warn">! ' + esc(t("missing")) + "</span>") + "</li></ul>" +
        (closed ? "" : '<div class="row"><button class="btn btn-primary btn-sm" data-act="approve">' + esc(t("approve")) + '</button><button class="btn btn-secondary btn-sm" data-act="fix"' + (r.status === "action" ? " disabled" : "") + ">" + esc(t("request_fix")) + '</button><button class="btn btn-danger btn-sm" data-act="reject">' + esc(t("reject")) + "</button></div>" + rej) +
        "<h3>" + esc(t("case_history")) + '</h3><ul class="plain">' + hist + "</ul></section>";
    }
    return '<div class="row"><h1 tabindex="-1">' + esc(t("ws_title")) + '</h1></div><p class="muted">' + esc(t("ws_office")) + "</p>" +
      '<div class="kpis"><div class="kpi"><span class="small muted">' + esc(t("kpi_open")) + "</span><b>" + open + '</b></div><div class="kpi"><span class="small muted">' + esc(t("kpi_risk")) + "</span><b>" + risk + '</b></div><div class="kpi"><span class="small muted">' + esc(t("kpi_median")) + "</span><b>" + esc(t("kpi_days", { n: "2.4" })) + "</b></div></div>" +
      '<div class="ws-grid"><section class="stack" aria-labelledby="qh"><h2 id="qh">' + esc(t("queue")) + '</h2><div class="table-wrap"><table><thead><tr><th scope="col">' + esc(t("col_ref")) + '</th><th scope="col">' + esc(t("col_service")) + '</th><th scope="col">' + esc(t("col_applicant")) + '</th><th scope="col">' + esc(t("col_status")) + '</th><th scope="col">' + esc(t("col_sla")) + "</th></tr></thead><tbody>" + rows + "</tbody></table></div></section>" + detail + "</div>";
  }

  /* ---------- Shell ---------- */
  function shell(r) {
    var L = I18N[state.lang];
    document.documentElement.lang = state.lang; document.documentElement.dir = L.dir;
    document.getElementById("skip-link").textContent = t("skip");
    document.getElementById("env-banner").textContent = t("banner");
    document.getElementById("footer").textContent = t("footer");
    var lg = document.getElementById("lang-group"); lg.setAttribute("aria-label", t("lang"));
    Array.prototype.forEach.call(lg.querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang)); });
    var mg = document.getElementById("mode-group"); mg.setAttribute("aria-label", t("mode"));
    mg.innerHTML = '<button type="button" data-mode="citizen" aria-pressed="' + (state.mode === "citizen") + '">' + esc(t("mode_citizen")) + '</button><button type="button" data-mode="officer" aria-pressed="' + (state.mode === "officer") + '">' + esc(t("mode_officer")) + "</button>";
    var tabs = [["home", "nav_home", ICON.home], ["service", "nav_services", ICON.service], ["request", "nav_requests", ICON.request], ["wallet", "nav_wallet", ICON.wallet], ["privacy", "nav_me", ICON.privacy]];
    var tn = document.getElementById("topnav"), tb = document.getElementById("tabbar");
    if (state.mode === "citizen") {
      var cur = r === "guide" ? "home" : r;
      tn.innerHTML = tabs.map(function (x) { return '<a href="#' + x[0] + '"' + (cur === x[0] ? ' aria-current="page"' : "") + ">" + esc(t(x[1])) + "</a>"; }).join("") +
        "";
      tn.setAttribute("aria-label", t("nav_home"));
      tb.innerHTML = tabs.map(function (x) { return '<a href="#' + x[0] + '"' + (cur === x[0] ? ' aria-current="page"' : "") + ">" + x[2] + "<span>" + esc(t(x[1])) + "</span></a>"; }).join("");
      tb.hidden = false;
    } else { tn.innerHTML = ""; tb.innerHTML = ""; tb.hidden = true; }
  }
  function render(focus) {
    var r = route();
    if (r === "workspace" && state.mode !== "officer") state.mode = "officer";
    if (r !== "workspace" && state.mode === "officer") state.mode = "citizen";
    shell(r);
    var main = document.getElementById("main");
    main.className = r === "workspace" ? "wide" : "";
    var mandate = (state.mode === "citizen" && state.acting === "hedi") ? '<div class="mandate" role="status"><span>' + esc(t("mandate_banner")) + '</span><button class="btn btn-secondary btn-sm" data-acting="me">' + esc(t("switch_back")) + "</button></div>" : "";
    var html = { home: vHome, guide: vGuide, service: vService, request: vRequest, wallet: vWallet, privacy: vPrivacy, workspace: vWorkspace }[r]();
    main.innerHTML = mandate + html;
    if (r === "wallet" && state.presenting) drawQR();
    if (focus) { var h = main.querySelector("h1"); if (h) h.focus({ preventScroll: false }); }
  }

  /* ---------- Demo QR (not a real QR code) ---------- */
  function drawQR() {
    var c = document.getElementById("qr"); if (!c) return;
    var ctx = c.getContext("2d"), n = 29, s = Math.floor(c.width / (n + 2));
    var cs = getComputedStyle(document.documentElement);
    var fg = "#1A1F25", bg = "#FFFFFF";
    ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
    var seed = 7; Object.keys(state.share).forEach(function (k, i) { if (state.share[k]) seed = (seed * 31 + i + 1) % 2147483647; });
    function rnd() { seed = (seed * 48271) % 2147483647; return seed / 2147483647; }
    ctx.fillStyle = fg;
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      if (!inF && rnd() > 0.52) ctx.fillRect((x + 1) * s, (y + 1) * s, s, s);
    }
    [[0, 0], [n - 7, 0], [0, n - 7]].forEach(function (p) {
      ctx.fillStyle = fg; ctx.fillRect((p[0] + 1) * s, (p[1] + 1) * s, 7 * s, 7 * s);
      ctx.fillStyle = bg; ctx.fillRect((p[0] + 2) * s, (p[1] + 2) * s, 5 * s, 5 * s);
      ctx.fillStyle = fg; ctx.fillRect((p[0] + 3) * s, (p[1] + 3) * s, 3 * s, 3 * s);
    });
    void cs;
  }

  /* ---------- Events ---------- */
  function addLog(k) { state.log.unshift([k, now()]); }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button, [data-case]"); if (!el) return;
    var d = el.dataset;
    if (d.lang) { state.lang = d.lang; try { localStorage.setItem(STORE_KEY, state.lang); } catch (err) { } render(false); return; }
    if (d.mode) { state.mode = d.mode; go(d.mode === "officer" ? "workspace" : "home"); return; }
    if (d.acting) { state.acting = d.acting; if (d.acting === "hedi") addLog("le_agent"); go("home"); return; }
    if (d.go) { go(d.go); return; }
    if (d.ask) { ask(d.ask); return; }
    if (d.fb) { state.fb[d.fb] = true; render(false); return; }
    if (d.book) { state.appt = d.book; toast(t("booked", { t: d.book })); render(false); return; }
    if (d.revoke) { state.consents[d.revoke] = false; toast(t("revoked_msg")); render(false); return; }
    if (d.share) return;
    if (d.case) { state.selected = d.case; state.rejecting = false; if (d.case === "REQ-2026-00412") addLog("le_view"); render(false); return; }
    var a = d.act;
    if (a === "upload") { state.req.addr = true; state.req.status = "review"; state.req.history.push(["review", now()]); addLog("le_upload"); toast(t("uploaded_msg")); render(false); }
    else if (a === "download") toast(t("download_msg"));
    else if (a === "cancel") { state.appt = null; toast(t("cancelled")); render(false); }
    else if (a === "present") { state.presenting = true; render(false); }
    else if (a === "hideqr") { state.presenting = false; render(false); }
    else if (a === "approve") {
      if (!state.req.addr) { toast(t("cannot_approve")); return; }
      state.req.status = "ready"; state.req.history.push(["approved", now()], ["ready", now()]); addLog("le_decision"); addLog("le_sms"); toast(t("approved_msg")); render(false);
    }
    else if (a === "fix") { state.req.status = "action"; state.req.addr = false; state.req.history.push(["action", now()]); addLog("le_fix"); addLog("le_sms"); toast(t("fix_msg")); render(false); }
    else if (a === "reject") { state.rejecting = true; render(false); var s = document.getElementById("rr"); if (s) s.focus(); }
    else if (a === "confirmreject") { var sel = document.getElementById("rr"); state.req.reason = sel ? sel.value : "r1"; state.req.status = "rejected"; state.req.history.push(["rejected", now()]); state.rejecting = false; addLog("le_decision"); addLog("le_sms"); toast(t("rejected_msg")); render(false); }
  });
  document.addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-share");
    if (k) { state.share[k] = e.target.checked; render(false); var cb = document.getElementById("sh-" + k); if (cb) cb.focus(); }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "composer") return;
    e.preventDefault();
    var inp = document.getElementById("q"); var text = (inp.value || "").trim(); if (!text) return;
    var match = ["q1", "q2", "q3", "q4"].filter(function (k) { return ["ar", "fr", "en"].some(function (l) { return I18N[l][k].trim() === text; }); })[0];
    if (match) { ask(match); return; }
    var pii = /[^\s@]+@[^\s@]+\.[^\s@]+|\+?\d[\d\s]{6,}\d/;
    var hadPii = pii.test(text);
    var clean = text.replace(/[^\s@]+@[^\s@]+\.[^\s@]+/g, "[•••]").replace(/\+?\d[\d\s]{6,}\d/g, "[•••]");
    state.chat.push({ role: "user", text: clean });
    if (hadPii) state.chat.push({ role: "bot", sys: "redacted" });
    state.chat.push({ role: "bot", sys: "demo_only" });
    render(false);
    var i2 = document.getElementById("q"); if (i2) i2.focus();
  });
  function ask(k) { state.chat.push({ role: "user", k: k }); state.chat.push({ role: "bot", k: "a" + k.slice(1) }); render(false); var i = document.getElementById("q"); if (i) i.focus(); }
  window.addEventListener("hashchange", function () { render(true); });

  try { var saved = localStorage.getItem(STORE_KEY); if (saved && I18N[saved]) state.lang = saved; } catch (err) { }
  if (location.hash === "#workspace") state.mode = "officer";
  render(false);
})();
</script>
