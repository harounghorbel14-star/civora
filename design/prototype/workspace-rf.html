<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace RF Prototype</title>
<style>
/* Usability-test prototype for CIVORA Workspace — Regulated Finance.
   Synthetic data only. Not product code: no backend, no network calls, no storage.
   Tokens mirror design/tokens/civora.tokens.json (v1.0). */
:root {
  --bg: #F6F7F8; --surface: #FFFFFF; --sunken: #EDEFF1;
  --brand: #0F5551; --brand-hover: #0B4341; --brand-subtle: #E8F4F3;
  --text: #1A1F25; --text-2: #545E69; --on-brand: #FFFFFF; --link: #0F5551;
  --border: #DCE0E4; --control: #6B7580; --focus: #1D5A9E;
  --ok: #1C6B3A; --ok-bg: #E8F5EC; --warn: #8A5A00; --warn-bg: #FFF6E5;
  --danger: #A4211B; --danger-bg: #FDECEA; --info: #1D5A9E; --info-bg: #E8F0FA;
  --banner-bg: #FCE7B8; --banner-fg: #5A3B00;
  --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  --font-lat: "IBM Plex Sans", "Noto Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1317; --surface: #1A1F25; --sunken: #2A3139;
    --brand: #67B5AE; --brand-hover: #9CD0CB; --brand-subtle: #073230;
    --text: #F6F7F8; --text-2: #C2C8CF; --on-brand: #073230; --link: #9CD0CB;
    --border: #3E4751; --control: #9AA3AD; --focus: #8DB6E8;
    --ok: #7FCB98; --ok-bg: #1A1F25; --warn: #F2C25C; --warn-bg: #1A1F25;
    --danger: #F19A93; --danger-bg: #1A1F25; --info: #8DB6E8; --info-bg: #1A1F25;
    --banner-bg: #5A3B00; --banner-fg: #FCE7B8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1317; --surface: #1A1F25; --sunken: #2A3139;
  --brand: #67B5AE; --brand-hover: #9CD0CB; --brand-subtle: #073230;
  --text: #F6F7F8; --text-2: #C2C8CF; --on-brand: #073230; --link: #9CD0CB;
  --border: #3E4751; --control: #9AA3AD; --focus: #8DB6E8;
  --ok: #7FCB98; --ok-bg: #1A1F25; --warn: #F2C25C; --warn-bg: #1A1F25;
  --danger: #F19A93; --danger-bg: #1A1F25; --info: #8DB6E8; --info-bg: #1A1F25;
  --banner-bg: #5A3B00; --banner-fg: #FCE7B8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-lat); font-size: 16px; line-height: 1.5; }
html[lang="ar"] body { font-family: var(--font-ar); }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.banner { background: var(--banner-bg); color: var(--banner-fg); font-size: 14px; font-weight: 600; text-align: center; padding: 8px 16px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.brand { font-weight: 700; color: var(--brand); font-size: 18px; }
.bank { color: var(--text-2); font-size: 14px; }
.spacer { flex: 1 1 auto; }
nav.main { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
nav.main a { text-decoration: none; padding: 8px 12px; border-radius: 8px; color: var(--text); font-weight: 500; font-size: 15px; }
nav.main a[aria-current="page"] { background: var(--brand-subtle); color: var(--brand); font-weight: 700; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
main > *, .grid > *, .stack > * { min-width: 0; }
h1 { font-size: 24px; line-height: 1.3; margin: 8px 0 12px; }
h2 { font-size: 19px; margin: 20px 0 8px; }
h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--text-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid.two { grid-template-columns: 3fr 2fr; } .grid.kpi { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 560px) and (max-width: 899px) { .grid.kpi { grid-template-columns: repeat(2, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); cursor: pointer; min-height: 44px; }
button.secondary { background: var(--surface); color: var(--brand); }
button.ghost { background: transparent; color: var(--link); border-color: transparent; text-decoration: underline; padding: 6px 8px; min-height: 36px; }
button.small { padding: 6px 10px; min-height: 36px; font-size: 14px; }
button:hover { filter: brightness(0.95); }
label { font-weight: 600; display: block; margin-bottom: 4px; }
.hint { font-size: 14px; color: var(--text-2); margin-top: 2px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--control); border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 44px; }
textarea { min-height: 96px; resize: vertical; }
fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 0; }
legend { font-weight: 600; padding: 0 4px; }
.radio { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 4px 0; }
.radio input, .check input { width: 20px; height: 20px; min-height: 0; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 6px 0; }
.field { margin-bottom: 12px; }
.err { color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.okmsg { color: var(--ok); background: var(--ok-bg); border: 1px solid var(--ok); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.note { background: var(--info-bg); color: var(--text); border-inline-start: 4px solid var(--info); padding: 8px 12px; border-radius: 4px; font-size: 14px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--sunken); font-size: 14px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.ref { font-family: var(--font-mono); font-weight: 600; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.b-over { color: var(--danger); background: var(--danger-bg); }
.b-risk { color: var(--warn); background: var(--warn-bg); }
.b-ok { color: var(--ok); background: var(--ok-bg); }
.b-info { color: var(--info); background: var(--info-bg); }
.b-neutral { color: var(--text-2); background: var(--sunken); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.filters button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.filters button[aria-pressed="false"] { background: var(--surface); color: var(--brand); }
.kv { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 6px 12px; font-size: 15px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; }
ol.timeline { list-style: none; padding: 0; margin: 0; }
ol.timeline li { padding: 6px 0 6px 12px; border-inline-start: 3px solid var(--border); margin-inline-start: 4px; }
ol.timeline time { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); display: block; }
pre { background: var(--sunken); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; font-family: var(--font-mono); max-height: 360px; }
.kpi .num { font-size: 28px; font-weight: 700; }
.bar { display: block; height: 10px; background: var(--brand); border-radius: 6px; }
.barrow { display: grid; grid-template-columns: minmax(110px, 35%) 1fr 40px; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
/* Customer status page: mobile-first column */
.phone { max-width: 420px; margin: 0 auto; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.langs button[aria-pressed="false"] { background: var(--surface); color: var(--brand); }
.skip { position: absolute; left: 8px; top: -60px; background: var(--surface); color: var(--link); padding: 8px 12px; border-radius: 8px; z-index: 10; }
.skip:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
footer { max-width: 1180px; margin: 24px auto; padding: 0 16px 32px; color: var(--text-2); font-size: 13px; }
</style>
</head>

      cs.timeline.push({ d: TODAY, t: "Décision émise : " + T.fr.outcomes[out] + " (" + rc + ")" }); log("Décision émise pour " + cs.ref + " (" + out + ", " + rc + ")");
      route(); var m = document.getElementById("main"); m.insertAdjacentHTML("afterbegin", '<p class="okmsg" role="status">' + esc(t.issued) + "</p>"); say(t.issued); return;
    }
    if (f.id === "track") {
      var r = document.getElementById("t-ref").value.trim().toUpperCase(), code = document.getElementById("t-code").value.trim();
      if (r === "RC-2026-0418" && code === "482913") { state.custCase = r; route(); return; }
      document.getElementById("track-err").innerHTML = '<p class="err">' + esc(state.custLang === "ar" ? "المرجع أو الرمز غير صحيح." : T[state.custLang === "en" ? "en" : "fr"].stErr) + "</p>"; return;
    }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "pack") { state.pack = e.target.value; log("Pack de règles sélectionné : " + state.pack); route(); } });
  window.addEventListener("hashchange", function () { route(); var m = document.getElementById("main"); if (m) m.focus({ preventScroll: false }); });
  seed(); route();
})();
</script>
