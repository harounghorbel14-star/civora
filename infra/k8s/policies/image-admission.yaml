apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: civora-image-source-pods
spec:
  policyName: civora-image-source-pods
  validationActions: [Deny, Audit]
  paramRef: { name: civora-image-policy, namespace: civora-system, parameterNotFoundAction: Deny }
  matchResources:
    namespaceSelector:
      matchLabels: { civora.tn/image-policy: enforced }
