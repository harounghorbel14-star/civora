# promtool unit tests for the services-directory group of civora-infrastructure-alerts.yaml (doc phase-5/04).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: integrity failure pages at once; two replicas give one alert; the monitor not running
    interval: 1m
    input_series:
      - { series: 'civora_catalogue_integrity_failures{namespace="civora-tn",pod="core-a"}', values: '0 0 1 1 0' }
      - { series: 'civora_catalogue_integrity_failures{namespace="civora-tn",pod="core-b"}', values: '0 0 1 1 0' }
      # Last run at t=0 (seconds), then no run any more.
      - { series: 'civora_catalogue_integrity_last_run_timestamp_seconds{namespace="civora-tn",pod="core-a"}', values: '0x240' }
    alert_rule_test:
      - { eval_time: 1m, alertname: CivoraCatalogueIntegrityFailure, exp_alerts: [] }
      - eval_time: 2m
        alertname: CivoraCatalogueIntegrityFailure
        exp_alerts:
          - exp_labels: { severity: page, namespace: civora-tn }
            exp_annotations: { summary: "Published directory content in civora-tn no longer matches what was approved and signed: pages may show unapproved text.", runbook: "docs/phase-5/04-integrity-and-freshness.md §3" }
      - { eval_time: 4m, alertname: CivoraCatalogueIntegrityFailure, exp_alerts: [] }
      - { eval_time: 3h, alertname: CivoraCatalogueIntegrityNotRunning, exp_alerts: [] }
      - eval_time: 3h16m
        alertname: CivoraCatalogueIntegrityNotRunning
        exp_alerts:
          - exp_labels: { severity: ticket, namespace: civora-tn }
            exp_annotations: { summary: "The directory integrity monitor in civora-tn has not completed a run for 3 hours.", runbook: "docs/phase-5/04-integrity-and-freshness.md §3" }
  - name: freshness (P5-AC2) and stale procedures
    # Sampled every minute, as Prometheus scrapes the core (an hourly series would go stale between samples).
    interval: 1m
    input_series:
      - { series: 'civora_catalogue_last_verified_median_age_days{namespace="civora-tn",pod="core-a"}', values: '89x59 90x200' }
      - { series: 'civora_catalogue_stale_services{namespace="civora-tn",pod="core-a"}', values: '0x59 2x1600' }
    alert_rule_test:
      - { eval_time: 1h30m, alertname: CivoraCatalogueVerificationOverdue, exp_alerts: [] }
      - eval_time: 2h1m
        alertname: CivoraCatalogueVerificationOverdue
        exp_alerts:
          - exp_labels: { severity: ticket, namespace: civora-tn }
            exp_annotations: { summary: "The median last-verified age of published procedures in civora-tn is 90 days or more (P5-AC2): editors must re-verify against the official sources.", runbook: "docs/phase-5/04-integrity-and-freshness.md §4" }
      - { eval_time: 12h, alertname: CivoraCatalogueStaleServices, exp_alerts: [] }
      - eval_time: 25h30m
        alertname: CivoraCatalogueStaleServices
        exp_alerts:
          - exp_labels: { severity: ticket, namespace: civora-tn }
            exp_annotations: { summary: "Some published procedures in civora-tn were last verified more than 90 days ago.", runbook: "docs/phase-5/04-integrity-and-freshness.md §4" }
