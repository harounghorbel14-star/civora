# Local rehearsal only: a single PostgreSQL 16 pod standing in for the PostgreSQL cluster
# that runs on dedicated database nodes in staging/prod (Patroni + pgBackRest; ADR-003, ADR-029).
# Synthetic data only. The password comes from the Secret created by deploy-from-scratch.sh.
apiVersion: v1
kind: Service
metadata:
  name: pg-core
  labels: { app.kubernetes.io/name: pg-core }
spec:
  selector: { app.kubernetes.io/name: pg-core }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-core
  labels: { app.kubernetes.io/name: pg-core }
spec:
  serviceName: pg-core
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pg-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pg-core }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres user in the alpine image
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: POSTGRES_USER, value: civora_core }
            - { name: POSTGRES_DB, value: civora_core }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256 --data-checksums" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-core-superuser, key: password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "civora_core", "-d", "civora_core"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
