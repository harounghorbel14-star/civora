# Keycloak (ADR-005) for a CIVORA cell: 3 instances managed by the Keycloak Operator 26.8.1
# (infra/argocd/platform/staging-tn/keycloak-operator.yaml). Instances form one Infinispan cluster through the
# database (jdbc-ping) and keep user sessions in it, so losing a pod does not log users out (tested:
# infra/tests/keycloak-ha/run.sh). Database: own database "keycloak" on the HA PostgreSQL tier through pg-router,
# verify-full TLS. Secrets (keycloak-db, keycloak-tls, keycloak-db-ca, keycloak-attestation-roots) come from OpenBao via
# External Secrets.
# Exposure: no Ingress from the operator; the edge gateway is pending founder decision ADR-030.
# Password deny list (ASVS 5.0 V6.2.4, V6.2.12; Phase 3 doc 11): ConfigMap keycloak-password-deny-list from
# infra/keycloak/password-deny-list/civora-deny.txt (kubectl create configmap keycloak-password-deny-list -n keycloak
# --from-file=civora-deny.txt=infra/keycloak/password-deny-list/civora-deny.txt). The realms' password policy names
# it: a realm import without the file fails, so a missing list cannot silently weaken the policy.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  # Mirrored into the cell registry from quay.io/keycloak/keycloak:26.8.1 (same digest as docker.io/keycloak/keycloak:26.8.1).
  image: registry.staging.civora.invalid/mirror/keycloak@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
  db:
    vendor: postgres
    host: pg-router.civora-tn.svc
    port: 5432
    database: keycloak
    usernameSecret: { name: keycloak-db, key: username }
    passwordSecret: { name: keycloak-db, key: password }
    poolMinSize: 5
    poolMaxSize: 30
  additionalOptions:
    - name: db-url-properties
      value: "?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/db-ca/ca.crt"
    - name: metrics-enabled
      value: "true"
  http:
    tlsSecret: keycloak-tls
  hostname:
    hostname: https://auth.staging.civora.invalid   # placeholder until DNS and the edge gateway exist
    strict: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  # Attestation roots of the approved security-key vendors (staff realm, P3-SEC5; Phase 3 doc 03). Without them no key
  # can be enrolled (fails closed); the approved models are set by infra/keycloak/apply-realm-policy.py --approved-keys.
  truststores:
    attestation-roots:
      secret:
        name: keycloak-attestation-roots
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: { matchLabels: { app: keycloak } }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  unsupported:
    podTemplate:
      spec:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          seccompProfile: { type: RuntimeDefault }
        containers:
          - name: keycloak
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
            volumeMounts:
              - { name: db-ca, mountPath: /opt/keycloak/conf/db-ca, readOnly: true }
              - { name: password-deny-list, mountPath: /opt/keycloak/data/password-blacklists, readOnly: true }
        volumes:
          - name: db-ca
            secret: { secretName: keycloak-db-ca }
          - name: password-deny-list
            configMap: { name: keycloak-password-deny-list }
