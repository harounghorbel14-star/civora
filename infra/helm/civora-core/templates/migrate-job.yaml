{{- if .Values.migrations.enabled }}
# Expand-only migrations run before the new version starts (ADR-024). Contract migrations ship in a later release.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "civora-core.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "civora-core.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      annotations: {{- include "civora-core.checkovSkips" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "civora-core.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "civora-core.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "civora-core.containerSecurity" . | nindent 12 }}
          # The URL is read from the mounted secret file into the process environment only (never the pod spec).
          command: ["sh", "-c", "DATABASE_URL=\"$(cat /var/run/secrets/civora/database-url)\" exec node node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir migrations --migration-file-language sql --migrations-table schema_migrations --check-order"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db-secret, mountPath: /var/run/secrets/civora, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        {{- include "civora-core.dbSecretVolume" . | nindent 8 }}
{{- end }}
