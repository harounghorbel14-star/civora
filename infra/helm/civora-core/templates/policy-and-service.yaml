apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "civora-core.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "civora-core.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "civora-core.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "civora-core.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "civora-core.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "civora-core.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "civora-core.name" . }} }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Default deny for the release's pods, then explicit allows (ADR-013, threat model).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "civora-core.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "civora-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "civora-core.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  {{- if or .Values.networkPolicy.ingressFromNamespaces .Values.networkPolicy.metricsFromNamespaces }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
        {{- range .Values.networkPolicy.metricsFromNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
      ports:
        - { port: http, protocol: TCP }
  {{- else }}
  ingress: []   # no namespace allowed: deny all ingress rather than an empty "from" (which would allow all)
  {{- end }}
  egress:
    - to:   # DNS
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:   # PostgreSQL: in-cluster pods (dev, rehearsal) and/or dedicated database nodes (staging, pilot, prod)
        {{- with .Values.networkPolicy.databasePodSelector }}
        - podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ default $.Release.Namespace $.Values.networkPolicy.databaseNamespace }} } }
        {{- end }}
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { port: 5432, protocol: TCP }
    {{- if .Values.otel.endpoint }}
    - to:   # Keycloak: token signing keys (JWKS) and the admin API of the provisioner client (Phase 3)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.keycloakNamespace }} } }
      ports:
        {{- range .Values.networkPolicy.keycloakPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    - to:   # OpenTelemetry collector
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelNamespace }} } }
      ports:
        - { port: 4318, protocol: TCP }
    {{- end }}
{{- end }}
