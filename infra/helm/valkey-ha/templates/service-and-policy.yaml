# Headless service: stable per-pod names, published before readiness (Sentinels and replicas need them at start).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  namespace: {{ .Release.Namespace }}
  labels: {{- include "valkey-ha.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "valkey-ha.selector" . | nindent 4 }}
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
    - { name: sentinel, port: 26379, targetPort: sentinel }
---
# Clients (ioredis/BullMQ) discover the current primary through the Sentinels.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sentinel
  namespace: {{ .Release.Namespace }}
  labels: {{- include "valkey-ha.labels" . | nindent 4 }}
spec:
  selector: {{- include "valkey-ha.selector" . | nindent 4 }}
  ports:
    - { name: sentinel, port: 26379, targetPort: sentinel }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "valkey-ha.labels" . | nindent 4 }}
spec:
  minAvailable: 2
  selector:
    matchLabels: {{- include "valkey-ha.selector" . | nindent 6 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "valkey-ha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "valkey-ha.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "valkey-ha.selector" . | nindent 14 }}
        {{- range .Values.networkPolicy.clients }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .namespace }} } }
          podSelector:
            matchLabels: {{- toYaml .podSelector | nindent 14 }}
        {{- end }}
      ports:
        - { port: 6379, protocol: TCP }
        - { port: 26379, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "valkey-ha.selector" . | nindent 14 }}
      ports:
        - { port: 6379, protocol: TCP }
        - { port: 26379, protocol: TCP }
    - to:   # DNS (pod names)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
{{- end }}
