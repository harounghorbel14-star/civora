apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pg-router.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "pg-router.selector" . | nindent 4 }}
  ports:
    - { name: postgres, port: {{ .Values.postgresPort }}, targetPort: postgres }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pg-router.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "pg-router.selector" . | nindent 6 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pg-router.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pg-router.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.clientPodSelector | nindent 14 }}
      ports:
        - { port: postgres, protocol: TCP }
  egress:
    {{- if .Values.networkPolicy.databaseCidrs }}
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { port: {{ .Values.postgresPort }}, protocol: TCP }
        - { port: {{ .Values.patroniApiPort }}, protocol: TCP }
    {{- else }}
    []
    {{- end }}
{{- end }}
