{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pg-router.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "pg-router.selector" . | nindent 6 }}
  endpoints:
    - { port: metrics, path: /metrics, interval: 30s }
{{- end }}
