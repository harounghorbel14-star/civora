# Argo CD project for a cell's platform services (cert-manager, External Secrets, OpenBao, Keycloak, admission policies).
# Separate from the application project (civora-tn): platform charts install CRDs, webhooks and cluster roles, so
# only this project may create those cluster-scoped kinds, and only from the chart repositories listed here.
# Air-gapped and customer-hosted cells (ADR-019) mirror these charts into the cell's OCI registry and change
# sourceRepos accordingly.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: civora-platform
  namespace: argocd
spec:
  description: Platform services of a CIVORA cell. Chart versions pinned; values in Git.
  sourceRepos:
    - https://github.com/harounghorbel14-star/civora.git
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://openbao.github.io/openbao-helm
    - https://github.com/keycloak/keycloak-k8s-resources.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://sigstore.github.io/helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: openbao }
    - { server: https://kubernetes.default.svc, namespace: civora-system }
    - { server: https://kubernetes.default.svc, namespace: keycloak }
    - { server: https://kubernetes.default.svc, namespace: observability }
    - { server: https://kubernetes.default.svc, namespace: cosign-system }
    - { server: https://kubernetes.default.svc, namespace: kube-system }   # kube-prometheus-stack scrape services
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
    - { group: cert-manager.io, kind: ClusterIssuer }
    - { group: external-secrets.io, kind: ClusterSecretStore }
    - { group: monitoring.coreos.com, kind: "*" }
    - { group: policy.sigstore.dev, kind: ClusterImagePolicy }
  orphanedResources:
    warn: true
