# Sigstore policy-controller (image signature enforcement, ADR-027) and the CIVORA image policy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-controller-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-25" }
spec:
  project: civora-platform
  sources:
    - repoURL: https://sigstore.github.io/helm-charts
      chart: policy-controller
      targetRevision: 0.10.8
      helm:
        valueFiles: ["$values/infra/argocd/platform/values/policy-controller.yaml"]
    - repoURL: https://github.com/harounghorbel14-star/civora.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: cosign-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    managedNamespaceMetadata:
      labels: { pod-security.kubernetes.io/enforce: restricted }
