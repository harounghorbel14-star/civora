# External Secrets Operator, chart 2.14.0 (tag helm-chart-2.14.0 of 23 Oct 2026). Delivers OpenBao secrets to
# workloads as Kubernetes Secrets mounted as files (docs/phase-2/07 §7.4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-10" }
spec:
  project: civora-platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        valueFiles: ["$values/infra/argocd/platform/values/external-secrets.yaml"]
    - repoURL: https://github.com/harounghorbel14-star/civora.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    managedNamespaceMetadata:
      labels: { pod-security.kubernetes.io/enforce: restricted }
