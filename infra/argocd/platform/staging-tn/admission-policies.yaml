# Image admission policy (ADR-027) and its per-cell parameters. Namespaces opt in with
# civora.tn/image-policy=enforced (the application namespace does).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admission-policies-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-30" }
spec:
  project: civora-platform
  source:
    repoURL: https://github.com/harounghorbel14-star/civora.git
    targetRevision: main
    path: infra/k8s/policies
  destination: { server: https://kubernetes.default.svc, namespace: civora-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
