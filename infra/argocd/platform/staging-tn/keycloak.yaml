# Keycloak instances (3, clustered) managed by the operator; see infra/k8s/keycloak/keycloak.yaml. ADR-005.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: civora-platform
  source:
    repoURL: https://github.com/harounghorbel14-star/civora.git
    targetRevision: main
    path: infra/k8s/keycloak
  destination: { server: https://kubernetes.default.svc, namespace: keycloak }
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never prune the identity provider automatically
    syncOptions: ["ServerSideApply=true"]
