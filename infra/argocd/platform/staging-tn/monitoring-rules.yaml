# CIVORA infrastructure alert rules (infra/k8s/monitoring), after the Prometheus Operator CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-rules-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: civora-platform
  source:
    repoURL: https://github.com/harounghorbel14-star/civora.git
    targetRevision: main
    path: infra/k8s/monitoring
    directory: { exclude: "tests/*" }
  destination: { server: https://kubernetes.default.svc, namespace: observability }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
