# cert-manager v1.21.3 (tag of 22 Oct 2026). Issues the cell's internal TLS certificates (OpenBao, webhooks).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-staging-tn
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-20" }
spec:
  project: civora-platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles: ["$values/infra/argocd/platform/values/cert-manager.yaml"]
    - repoURL: https://github.com/harounghorbel14-star/civora.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    managedNamespaceMetadata:
      labels: { pod-security.kubernetes.io/enforce: restricted }
