# Loki chart 7.5.0 (tag helm-loki-7.5.0 of 22 Oct 2026). Logs: 30 days hot (doc 15 §15.1). Object storage through
# the S3 API (ADR-020); bucket and credentials from OpenBao. Single-binary mode for staging.
deploymentMode: SingleBinary
singleBinary: { replicas: 1 }
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  schemaConfig:
    configs:
      - { from: "2026-11-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: loki_index_, period: 24h } }
  storage:
    type: s3
    bucketNames: { chunks: civora-staging-loki, ruler: civora-staging-loki, admin: civora-staging-loki }
    s3: { endpoint: s3.staging.civora.invalid, s3ForcePathStyle: true }
  limits_config: { retention_period: 720h }
  compactor: { retention_enabled: true, delete_request_store: s3 }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
