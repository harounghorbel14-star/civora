# Root ("app of apps") for the staging TN cell's platform services. Each child Application pins a chart version
# (verified against the upstream release tag, at least two weeks old when pinned) and takes its values from Git.
# Not yet included, by decision or by choice still open:
#   - ingress / API gateway: open question in ADR-013 (community ingress-nginx retired upstream, March 2026);
#   - Keycloak HA, Redis HA, observability stack: next increments (docs/phase-2/16-infrastructure-plan.md §16.7).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-staging-tn
  namespace: argocd
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: civora-platform
  source:
    repoURL: https://github.com/harounghorbel14-star/civora.git
    targetRevision: main
    path: infra/argocd/platform/staging-tn
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: false, selfHeal: true }
