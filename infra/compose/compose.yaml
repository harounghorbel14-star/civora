# CIVORA local development cell (O-D6, ADR-013). Synthetic data only.
# Mirrors the staging cell's components at single-node scale. Every port binds to 127.0.0.1.
# Start: infra/scripts/dev-cell-up.sh   (generates .env with random dev-only secrets; nothing is committed)
name: civora-dev

x-pg: &pg
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20
  security_opt: ["no-new-privileges:true"]

x-pgenv: &pgenv
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256

services:
  # --- Data tier (ADR-003): one cluster per trust zone ---
  pg-public:            # T3 public reference data (services directory, rule-pack texts)
    <<: *pg
    environment:
      <<: *pgenv
      POSTGRES_USER: civora_public
      POSTGRES_PASSWORD: ${PG_PUBLIC_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      POSTGRES_DB: civora_public
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pg-public:/var/lib/postgresql/data"]

  pg-core:              # T1/T2 tenant and case data; hosts the keycloak database in dev only
    <<: *pg
    environment:
      <<: *pgenv
      POSTGRES_USER: civora_core
      POSTGRES_PASSWORD: ${PG_CORE_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      POSTGRES_DB: civora_core
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      PG_CORE_APP_PASSWORD: ${PG_CORE_APP_PASSWORD:?run infra/scripts/dev-cell-up.sh}
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - pg-core:/var/lib/postgresql/data
      - ./postgres/core-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro

  pg-consent-audit:     # T1 (metadata) consent records and hash-chained audit (separate keys and backups in staging)
    <<: *pg
    environment:
      <<: *pgenv
      POSTGRES_USER: civora_audit
      POSTGRES_PASSWORD: ${PG_AUDIT_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      POSTGRES_DB: civora_audit
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["pg-consent-audit:/var/lib/postgresql/data"]

  redis:                # cache, rate limits, BullMQ queues (ADR-008)
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run infra/scripts/dev-cell-up.sh}
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    volumes: ["redis:/data"]
    security_opt: ["no-new-privileges:true"]

  object-store:         # S3-compatible storage (ADR-020). SeaweedFS (Apache-2.0) in dev; staging/prod per ADR-020
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - object-store:/data
      - ./.generated/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]

  # --- Identity (ADR-005) ---
  keycloak:
    image: docker.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true", "--metrics-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg-core:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      # Issuers as the browser sees them, whoever asks; services inside the cell reach Keycloak at keycloak:8080
      # (back-channel). Needed by the core's eID adapter, which exchanges codes inside the cell.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:8080:8080"]
    # Realms imported on first start; infra/scripts/dev-cell-up.sh then applies the post-import policy and checks
    # the live realms (infra/keycloak/apply-realm-policy.py, infra/scripts/check-realm-security.py --live).
    volumes:
      - ./keycloak/civora-dev-realm.json:/opt/keycloak/data/import/civora-dev-realm.json:ro
      - ../keycloak/realms/civora-citizens.json:/opt/keycloak/data/import/civora-citizens.json:ro
      - ../keycloak/realms/civora-staff.json:/opt/keycloak/data/import/civora-staff.json:ro
      - ../keycloak/password-deny-list/civora-deny.txt:/opt/keycloak/data/password-blacklists/civora-deny.txt:ro
      # SIMULATED national eID (synthetic identities only; dev cell and tests, never staging or production).
      - ../keycloak/simulators/sim-national-eid.json:/opt/keycloak/data/import/sim-national-eid.json:ro
    depends_on:
      pg-core: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  # --- Mail catcher (dev only): activation and invitation e-mails land here, readable at http://localhost:8025 ---
  mail:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    security_opt: ["no-new-privileges:true"]

  # --- Secrets (ADR-012). Dev mode: in-memory, auto-unsealed. Never used beyond a developer machine ---
  openbao:
    image: openbao/openbao:2.4.1
    restart: unless-stopped
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_TOKEN:?run infra/scripts/dev-cell-up.sh}
    cap_add: ["IPC_LOCK"]
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      retries: 20

  # --- Observability (ADR-011): OTel collector + Prometheus + Loki + Tempo + Grafana in one dev image ---
  observability:
    image: grafana/otel-lgtm:0.11.0
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run infra/scripts/dev-cell-up.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: ["observability:/data"]

  # --- Application ---
  core-migrate:
    image: civora-core:dev
    command: ["node", "node_modules/node-pg-migrate/bin/node-pg-migrate.js", "up", "--migrations-dir", "migrations", "--migration-file-language", "sql", "--migrations-table", "schema_migrations", "--check-order"]
    environment:
      DATABASE_URL: postgres://civora_core:${PG_CORE_PASSWORD}@pg-core:5432/civora_core
    depends_on:
      pg-core: { condition: service_healthy }
    restart: "no"

  core:
    image: civora-core:dev
    restart: unless-stopped
    environment:
      CIVORA_ENV: dev
      COUNTRY_PACK: tn
      APP_VERSION: dev-cell
      DATABASE_URL: postgres://civora_core_app:${PG_CORE_APP_PASSWORD}@pg-core:5432/civora_core
      # Tokens name the issuer as the browser sees it (localhost:8080); the core fetches the keys inside the cell.
      OIDC_ISSUER_CITIZENS: http://localhost:8080/realms/civora-citizens
      OIDC_JWKS_URL_CITIZENS: http://keycloak:8080/realms/civora-citizens/protocol/openid-connect/certs
      OIDC_ISSUER_STAFF: http://localhost:8080/realms/civora-staff
      OIDC_JWKS_URL_STAFF: http://keycloak:8080/realms/civora-staff/protocol/openid-connect/certs
      # Citizen registration (accounts created by the core, activation link by e-mail). The secret file is written by
      # dev-cell-up.sh (apply-realm-policy.py --provisioner-secret-out); while it is empty, registration answers 503.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PROVISIONER_SECRET_FILE: /run/secrets/keycloak-provisioner
      KEYCLOAK_STAFF_PROVISIONER_SECRET_FILE: /run/secrets/keycloak-staff-provisioner
      ACTIVATION_REDIRECT_URI: https://app.civora-cell.invalid/activated
      # Identity links through the SIMULATED national eID (Phase 3 doc 06); secret and digest key written by dev-cell-up.sh.
      EID_SIM_ISSUER: http://localhost:8080/realms/sim-national-eid
      EID_SIM_INTERNAL_URL: http://keycloak:8080
      EID_SIM_CLIENT_SECRET_FILE: /run/secrets/eid-sim-client
      EID_REDIRECT_URI: https://app.civora-cell.invalid/identity/eid/callback
      IDENTITY_CLAIM_DIGEST_KEY_FILE: /run/secrets/identity-digest-key
      # Customer status page (Phase 3 doc 09): synthetic cases; one-time codes by the simulated e-mail channel to the mail catcher.
      SYNTHETIC_CASES: "on"
      MESSAGING_SMTP_HOST: mail
      MESSAGING_SMTP_PORT: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_BSP_SCHEDULE_DELAY: "1000"   # dev only: export spans within a second
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./.generated/provisioner.secret:/run/secrets/keycloak-provisioner:ro
      - ./.generated/staff-provisioner.secret:/run/secrets/keycloak-staff-provisioner:ro
      - ./.generated/eid-sim-client.secret:/run/secrets/eid-sim-client:ro
      - ./.generated/identity-digest.key:/run/secrets/identity-digest-key:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      core-migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
      object-store: { condition: service_healthy }

volumes:
  pg-public: {}
  pg-core: {}
  pg-consent-audit: {}
  redis: {}
  object-store: {}
  observability: {}
