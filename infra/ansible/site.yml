---
# Cell bootstrap (ADR-013): OS baseline on every node, RKE2 (CIS profile) on Kubernetes nodes, then Argo CD.
# Usage: ansible-playbook -i inventories/<cell>.yml site.yml
# Inventory is generated by OpenTofu (infra/tofu/envs/<cell>). Database and backup nodes are prepared by the
# baseline only in Phase 2; PostgreSQL runs in-cluster under CloudNativePG (ADR-003) until a provider is chosen.
- name: OS baseline for every node
  hosts: all
  become: true
  roles:
    - role: base_hardening

- name: Kubernetes server nodes
  hosts: k8s_servers
  become: true
  serial: 1
  roles:
    - role: rke2
      vars:
        rke2_role: server

- name: Kubernetes agent nodes
  hosts: k8s_agents
  become: true
  roles:
    - role: rke2
      vars:
        rke2_role: agent

- name: GitOps controller
  hosts: k8s_servers[0]
  become: true
  roles:
    - role: argocd_bootstrap
