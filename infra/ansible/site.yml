---
# Cell bootstrap (ADR-013): OS baseline on every node, RKE2 (CIS profile) on Kubernetes nodes, then Argo CD.
# Usage: ansible-playbook -i inventories/<cell>.yml site.yml
# Inventory is generated by OpenTofu (infra/tofu/envs/<cell>). Database secrets and node certificates come from
# OpenBao at run time (see roles/postgresql_ha/README.md); nothing secret is stored in this repository.
- name: OS baseline for every node
  hosts: all
  become: true
  roles:
    - role: base_hardening

- name: Database and backup nodes (PostgreSQL 16 + Patroni + etcd + pgBackRest; ADR-003, ADR-029)
  hosts: db_nodes:backup:backup_dr
  become: true
  roles:
    - role: postgresql_ha

- name: Kubernetes server nodes
  hosts: k8s_servers
  become: true
  serial: 1
  roles:
    - role: rke2
      vars:
        rke2_role: server

- name: Kubernetes agent nodes
  hosts: k8s_agents
  become: true
  roles:
    - role: rke2
      vars:
        rke2_role: agent

- name: GitOps controller
  hosts: k8s_servers[0]
  become: true
  roles:
    - role: argocd_bootstrap
