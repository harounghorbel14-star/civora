---
# Cell bootstrap (ADR-013): OS baseline on every node, RKE2 (CIS profile) on Kubernetes nodes, then Argo CD.
# Usage: ansible-playbook -i inventories/<cell>.yml site.yml
# Inventory is generated by OpenTofu (infra/tofu/envs/<cell>). Database and backup nodes get the OS baseline only in
# Phase 2. The PostgreSQL role (PostgreSQL 16 + Patroni + pgBackRest; ADR-003, ADR-029) is planned work, listed in
# docs/phase-2/16-infrastructure-plan.md §16.7.
- name: OS baseline for every node
  hosts: all
  become: true
  roles:
    - role: base_hardening

- name: Kubernetes server nodes
  hosts: k8s_servers
  become: true
  serial: 1
  roles:
    - role: rke2
      vars:
        rke2_role: server

- name: Kubernetes agent nodes
  hosts: k8s_agents
  become: true
  roles:
    - role: rke2
      vars:
        rke2_role: agent

- name: GitOps controller
  hosts: k8s_servers[0]
  become: true
  roles:
    - role: argocd_bootstrap
